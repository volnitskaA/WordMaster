<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordMaster - Реєстрація</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">WordMaster</a>

        <div>
            <a href="index.html" class="btn btn-light">
                Вхід
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Реєстрація користувача
                    </h2>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Ім'я</label>
                            <input type="text" class="form-control"
                                   placeholder="Введіть ім'я">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   placeholder="example@gmail.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Стать</label>

                            <select class="form-select">
                                <option>Жіноча</option>
                                <option>Чоловіча</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Дата народження
                            </label>

                            <input type="date"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Пароль
                            </label>

                            <input type="password"
                                   class="form-control">
                        </div>

                        <a href="profile.html"
                           class="btn btn-success w-100">
                            Зареєструватися
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
