<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordMaster - Вхід</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            WordMaster
        </a>

        <div>
            <a href="register.html" class="btn btn-light">
                Реєстрація
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">
            <h1>Вивчення іноземних слів</h1>

            <p class="lead">
                WordMaster допомагає користувачам вивчати нові слова,
                переглядати переклад та відстежувати свій прогрес.
            </p>

            <a href="words.html" class="btn btn-primary btn-lg">
                Почати навчання
            </a>
        </div>

        <div class="col-md-5 offset-md-1">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Вхід до системи
                    </h3>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="example@gmail.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Пароль
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Введіть пароль">
                        </div>

                        <a href="profile.html"
                           class="btn btn-primary w-100">
                            Увійти
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
